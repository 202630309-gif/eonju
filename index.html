<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>찾았다! 에어컨 명당</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-yellow: #eab308;
      --accent-red: #ef4444;
      --border-color: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* 1. 스플래시 화면 */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      cursor: pointer;
      text-align: center;
      padding: 20px;
      transition: opacity 0.5s ease, visibility 0.5s;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .icon-container {
      font-size: 80px;
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.4)); }
      50% { transform: scale(1.1); filter: drop-shadow(0 0 25px rgba(56, 189, 248, 0.8)); }
    }

    .app-title {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .app-subtitle {
      font-size: 1.1rem;
      color: var(--text-sub);
      margin-bottom: 40px;
    }

    .touch-prompt {
      font-size: 0.95rem;
      color: var(--accent-blue);
      border: 1px solid var(--accent-blue);
      padding: 10px 20px;
      border-radius: 30px;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* 메인 컨테이너 */
    .container {
      width: 100%;
      max-width: 600px;
      padding: 20px;
      display: none;
      flex-direction: column;
      gap: 20px;
    }

    .container.active {
      display: flex;
    }

    header {
      text-align: center;
      padding: 10px 0;
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--accent-blue);
    }

    header p {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    /* 카드 스타일 */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 폼 요소 */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .inline-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 12px;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--accent-blue);
    }

    /* 온도 슬라이더 */
    .temp-control {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent-blue);
    }

    .temp-val {
      font-weight: bold;
      color: var(--accent-blue);
      font-size: 1.1rem;
      min-width: 45px;
    }

    /* 버튼 */
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: var(--bg-input);
      color: var(--text-sub);
      margin-top: 10px;
    }

    /* 교실 시각화 */
    .classroom-map {
      position: relative;
      background: #0f172a;
      border: 2px dashed var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .blackboard {
      background: #064e3b;
      color: #a7f3d0;
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      border: 1px solid #047857;
    }

    .aircon-unit {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      text-align: center;
      padding: 6px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .seating-grid {
      display: grid;
      gap: 8px;
      margin: 10px 0;
      overflow-x: auto;
    }

    .seat {
      aspect-ratio: 1;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      padding: 4px;
      text-align: center;
      transition: transform 0.2s;
    }

    .seat:hover {
      transform: scale(1.05);
    }

    /* 자리 온도 레벨 색상 */
    .seat-best { background-color: #15803d; color: #f0fdf4; border: 1px solid #22c55e; }
    .seat-cool { background-color: #0369a1; color: #f0f9ff; border: 1px solid #38bdf8; }
    .seat-cold { background-color: #1e1b4b; color: #a5b4fc; border: 1px solid #6366f1; }
    .seat-warm { background-color: #854d0e; color: #fefce8; border: 1px solid #eab308; }
    .seat-hot { background-color: #991b1b; color: #fef2f2; border: 1px solid #ef4444; }

    /* 범례 */
    .legend {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      font-size: 0.75rem;
      margin-top: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background:
