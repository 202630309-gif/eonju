<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>찾았다! 에어컨 명당 v3.0</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.75);
      --bg-card-border: rgba(255, 255, 255, 0.12);
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-yellow: #facc15;
      --accent-red: #f87171;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
      transition: max-width 0.3s ease;
    }

    .app-container.landscape-mode {
      max-width: 860px;
    }

    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      padding: 24px;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
    }

    .screen.active {
      display: flex;
      opacity: 1;
    }

    /* 1. 스플래시 화면 */
    #screen-splash {
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
    }
